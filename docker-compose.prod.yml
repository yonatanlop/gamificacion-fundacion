# Overlay para producción con HTTPS automático (Caddy + Let's Encrypt).
#
#   docker compose -f docker-compose.deploy.yml -f docker-compose.prod.yml up -d
#
# Requisitos:
#   - Un nombre de dominio que apunte a la IP pública de la VM. Sirve uno gratis
#     tipo sslip.io:  149-118-61-207.sslip.io  (no requiere registro).
#   - Puerto 443 abierto en la "Security List" de OCI (igual que el 80).
#   - En .env:  CADDY_DOMAIN=149-118-61-207.sslip.io   (CADDY_EMAIL es opcional)
#
# Con este overlay, "web" (nginx) deja de publicar el puerto directamente:
# Caddy publica 80 y 443, termina TLS y redirige a nginx por la red interna.

services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    command: >
      sh -c 'printf "%s {\n\treverse_proxy web:80\n}\n" "$$CADDY_DOMAIN" > /etc/caddy/Caddyfile
      && echo "--- Caddyfile ---" && cat /etc/caddy/Caddyfile
      && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
